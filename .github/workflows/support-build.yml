name: Project Earth Support - Bau und Pruefung

on:
  push:
    branches: ['claude/project-earth-support']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (PowerShell 5.1, .NET Framework)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Kern-Selbsttest (ohne Verlust und mit 10 % Paketverlust)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          & .\Project-Earth-Support\windows\test\core_test.ps1 -Src .\Project-Earth-Support\windows\src *>&1 | Tee-Object -FilePath out\kern.log
          $a = $LASTEXITCODE
          & .\Project-Earth-Support\windows\test\core_test.ps1 -Src .\Project-Earth-Support\windows\src -LossPercent 10 *>&1 | Tee-Object -FilePath out\kern-verlust.log
          if ($a -ne 0 -or $LASTEXITCODE -ne 0) { exit 1 }
      - name: Windows-Praxistest (Bildschirm, Eingaben, Ton, Kamera)
        if: always()
        shell: cmd
        run: |
          if not exist out mkdir out
          powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File Project-Earth-Support\windows\test\win_test.ps1 -Code Project-Earth-Support\windows\build\PesAll.cs -OutDir out > out\windows.log 2>&1
          set RC=%ERRORLEVEL%
          type out\windows.log
          exit /b %RC%
      - name: Fertiges Skript - Parser (PowerShell 5.1) und Selbsttest mit Oberflaeche
        if: always()
        shell: cmd
        run: |
          if not exist out mkdir out
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File Project-Earth-Support\windows\tools\parse_check.ps1 -Path Project-Earth-Support\windows\Project-Earth-Support.ps1 > out\parser.log 2>&1
          set RC1=%ERRORLEVEL%
          type out\parser.log
          powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File Project-Earth-Support\windows\Project-Earth-Support.ps1 -Selbsttest -Relaunched > out\selbsttest.log 2>&1
          set RC2=%ERRORLEVEL%
          type out\selbsttest.log
          if exist "C:\ProgramData\Project-Earth-Support\logs" xcopy /y /q "C:\ProgramData\Project-Earth-Support\logs\*" out\ >nul
          if not "%RC1%"=="0" exit /b 1
          exit /b %RC2%
      - name: Ergebnisse ablegen
        if: always()
        shell: bash
        run: |
          cd out
          git init -q
          git checkout -q -b ergebnisse
          git add -A
          git -c user.name="github-actions" -c user.email="actions@users.noreply.github.com" commit -q -m "Ergebnisse Windows (${GITHUB_SHA::8})" || true
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/claude/pes-ergebnisse-windows

  android:
    name: Android (Kern-Tests und APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Kern-Tests und APK bauen
        working-directory: Project-Earth-Support/android
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          RC=0
          gradle --no-daemon --console=plain :core:test :app:assembleRelease > "$GITHUB_WORKSPACE/out/android-build.log" 2>&1 || RC=$?
          tail -n 80 "$GITHUB_WORKSPACE/out/android-build.log"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          cp "$BT/lib/apksigner.jar" "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          exit $RC
      - name: Ergebnisse ablegen
        if: always()
        run: |
          cd out
          git init -q
          git checkout -q -b ergebnisse
          git add -A
          git -c user.name="github-actions" -c user.email="actions@users.noreply.github.com" commit -q -m "Ergebnisse Android (${GITHUB_SHA::8})" || true
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/claude/pes-ergebnisse-android
